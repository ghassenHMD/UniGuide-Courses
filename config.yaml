# Shared configuration (Person A and Person B). Do not hard-code these values elsewhere.
seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

data:
  min_user_reviews: 5
  min_course_reviews: 50
  max_reviews_per_course_text: 50
  n_users_sample: 30000
  relevance_threshold: 4
  max_user_reviews: 100            # users above this are treated as merged homonyms
  generic_user_names: ["deleted a"]  # lowercase, without the "By " prefix

split:
  test_ratio: 0.2
  val_ratio: 0.1
  cold_user_sizes: [0, 1, 3, 5]
  cold_user_group_ratio: 0.05   # share of users per cold-start group
  cold_course_ratio: 0.1

evaluation:
  k_values: [5, 10]
  n_seeds: 3

# Final model settings, shared by the notebooks and the Streamlit app.
# Update them with the values selected on validation (notebooks 03-07).

model:
  content: tfidf                 # tfidf | embeddings | fusion
  tfidf: {ngram_range: [1, 2], max_df: 0.5, rating_offset: 0.0}
  name_weight: 0.5               # embeddings only
  popularity_m_quantile: 0.99
  cf_method: knn                 # knn | svd
  cf_n_neighbors: 20
  cf_n_components: 20
  alpha: 0.5                     # CB weight for users with a long history
  alpha_schedule: [[2, 0.9], [5, 0.7]]   # [max_history, alpha]; empty history -> popularity

app:
  demo_user_id: null             # fixed demo user chosen in advance (null = first suggested user)
  default_k: 10